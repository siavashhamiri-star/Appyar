name: Build Android Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Prepare Keystore File
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "Keystore decoded successfully."
          else
            echo "No custom keystore provided. Fallback to debug signature."
          fi

      - name: Inject Configuration
        env:
          APYAR_API_URL: ${{ secrets.APYAR_API_URL }}
          PAYMENT_GATEWAY_URL: ${{ secrets.PAYMENT_GATEWAY_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          API_URL="${APYAR_API_URL:-https://api.apyar.ir/v1}"
          PAY_URL="${PAYMENT_GATEWAY_URL:-https://gateway.apyar.ir/pay}"
          cat <<EOF > local.properties
          APYAR_API_URL=$API_URL
          PAYMENT_GATEWAY_URL=$PAY_URL
          KEYSTORE_PATH=keystore/release.jks
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build All Release AAB
        run: |
          CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            CMD="gradle"
          fi
          $CMD bundleBazaarRelease --no-daemon
          $CMD bundleMyketRelease --no-daemon
          $CMD bundleGoogleplayRelease --no-daemon

      - name: Build All Release APK
        run: |
          CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            CMD="gradle"
          fi
          $CMD assembleBazaarRelease --no-daemon
          $CMD assembleMyketRelease --no-daemon
          $CMD assembleGoogleplayRelease --no-daemon

      - name: Upload Release AAB Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apyar-release-aab
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 14

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apyar-release-apk
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 14
