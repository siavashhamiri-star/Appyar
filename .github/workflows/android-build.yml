name: Build Android Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - aab

jobs:
  build:
    name: Build AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore File (If provided in Secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "keystore_available=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded successfully."
          else
            echo "keystore_available=false" >> $GITHUB_OUTPUT
            echo "No custom keystore provided. Fallback to debug signature."
          fi

      - name: Inject Secure Environment Variables
        env:
          APYAR_API_URL: ${{ secrets.APYAR_API_URL || 'https://api.apyar.ir/v1' }}
          PAYMENT_GATEWAY_URL: ${{ secrets.PAYMENT_GATEWAY_URL || 'https://gateway.apyar.ir/pay' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '' }}
        run: |
          cat <<EOF > local.properties
          APYAR_API_URL=$APYAR_API_URL
          PAYMENT_GATEWAY_URL=$PAYMENT_GATEWAY_URL
          KEYSTORE_PATH=keystore/release.jks
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Verify Security Configuration
        run: ./gradlew verifyReleaseSecurity --no-daemon

      - name: Print Build Configuration Info
        run: ./gradlew printBuildInfo --no-daemon

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab' || github.event_name != 'workflow_dispatch' }}
        run: |
          ./gradlew bundleBazaarRelease --no-daemon
          ./gradlew bundleMyketRelease --no-daemon
          ./gradlew bundleGoogleplayRelease --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || github.event_name != 'workflow_dispatch' }}
        run: |
          ./gradlew assembleBazaarRelease --no-daemon
          ./gradlew assembleMyketRelease --no-daemon
          ./gradlew assembleGoogleplayRelease --no-daemon

      - name: Upload Release AAB Artifacts (Bazaar, Myket, Google Play)
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: apyar-market-bundles-aab
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 14

      - name: Upload Release APK Artifacts (Bazaar, Myket, Google Play)
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: apyar-market-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 14
